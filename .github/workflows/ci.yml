name: Dart CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  ci:
    name: Analyze, Test & Benchmarks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Dart SDK
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install Dependencies
        run: dart pub get

      - name: Check Code Formatting
        run: dart format --output=none --set-exit-if-changed . || dart format .
        continue-on-error: true

      - name: Static Code Analysis
        run: dart analyze --fatal-infos

      - name: Run Full Test Suite (Unit, Integration, Security, Fuzzing)
        run: dart test

      - name: Run Performance Benchmarks
        run: dart test test/stress/performance_benchmark_test.dart
