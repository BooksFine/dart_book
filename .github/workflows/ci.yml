name: Dart CI & Test Matrix

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  analyze_and_format:
    name: Analyze & Format (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Dart SDK
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install Dependencies
        run: dart pub get

      - name: Check Code Formatting
        run: dart format --output=none --set-exit-if-changed . || dart format .
        continue-on-error: true

      - name: Static Code Analysis
        run: dart analyze --fatal-infos

  test_matrix:
    name: Tests (${{ matrix.os }}, Dart ${{ matrix.sdk }})
    needs: analyze_and_format
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        sdk: [stable, beta]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Dart SDK
        uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ matrix.sdk }}

      - name: Install Dependencies
        run: dart pub get

      - name: Run Full Test Suite (Unit, Integration, Security, Fuzzing)
        run: dart test

      - name: Run Performance Benchmarks
        run: dart test test/stress/performance_benchmark_test.dart
