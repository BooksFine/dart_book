name: dart_book
description: A high-performance Dart library for parsing, serializing, and converting EPUB and FB2 e-books via a unified AST model.
version: 0.2.0
homepage: https://github.com/BooksFine/dart_book
repository: https://github.com/BooksFine/dart_book
issue_tracker: https://github.com/BooksFine/dart_book/issues

environment:
  sdk: '>=3.3.0 <4.0.0'

# Add regular dependencies here.
dependencies:
  archive: ^4.0.7
  crypto: ^3.0.7
  freezed_annotation: ^3.1.0
  html: ^0.15.6
  xml: ^7.0.1

dev_dependencies:
  build_runner: ^2.11.1
  freezed: ^3.2.5
  json_serializable: ^6.13.0
  lints: ^6.1.0 
  test: ^1.29.0


